<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Nova Shop</title>
    <meta name="theme-color" content="#0B74E5">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/client.css">
</head>
<body class="client-page d-flex flex-column min-vh-100 bg-light">

    <!-- HEADER RÚT GỌN -->
    <header class="main-header py-2" id="main-header">
        <div class="container-site text-center">
            <a href="index.html" class="header-logo justify-content-center text-decoration-none">
                <img src="assets/img/logo.svg" alt="Nova Shop" width="40" height="40">
                <span class="header-logo-text text-start">
                    <strong>NOVA SHOP</strong>
                    <small>Công nghệ chính hãng</small>
                </span>
            </a>
        </div>
    </header>

    <!-- FORM ĐĂNG KÝ -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container-site" style="max-width: 480px;">
            <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                
                <h1 class="fs-4 fw-bolder text-center text-dark mb-1">TẠO TÀI KHOẢN MỚI</h1>
                <p class="text-center text-muted small mb-4">Nhận ngay voucher 500.000₫ cho thành viên mới</p>

                <form action="login.html" method="GET">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" placeholder="Nguyễn Văn An" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" placeholder="0912345678" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" checked required>
                        <label class="form-check-label small text-muted" for="terms">
                            Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> và <a href="#" class="text-decoration-none">Chính sách bảo mật</a> của Nova Shop.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                        ĐĂNG KÝ TÀI KHOẢN
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    Đã có tài khoản? <a href="login.html" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a>
                </div>

                <div class="border-top mt-4 pt-3 text-center">
                    <a href="index.html" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer bg-dark text-white pt-3 pb-3 mt-auto">
        <div class="container-site text-center small text-secondary">
            © 2026 Nova Shop - Hệ thống laptop, PC &amp; linh kiện chính hãng.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
