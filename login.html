<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Nova Shop</title>
    <meta name="theme-color" content="#0B74E5">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/client.css">
</head>
<body class="client-page d-flex flex-column min-vh-100 bg-light">

    <!-- HEADER RÚT GỌN -->
    <header class="main-header py-2" id="main-header">
        <div class="container-site text-center">
            <a href="index.html" class="header-logo justify-content-center text-decoration-none">
                <img src="assets/img/logo.svg" alt="Nova Shop" width="40" height="40">
                <span class="header-logo-text text-start">
                    <strong>NOVA SHOP</strong>
                    <small>Công nghệ chính hãng</small>
                </span>
            </a>
        </div>
    </header>

    <!-- FORM ĐĂNG NHẬP -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container-site" style="max-width: 440px;">
            <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                
                <h1 class="fs-4 fw-bolder text-center text-dark mb-1">ĐĂNG NHẬP</h1>
                <p class="text-center text-muted small mb-4">Chào mừng bạn quay lại với hệ thống Nova Shop</p>

                <form action="orders.html" method="GET">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Địa chỉ Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="name@example.com" value="customer@novashop.vn" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-semibold mb-0">Mật khẩu</label>
                            <a href="#" class="small text-decoration-none text-primary">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" value="customer123" required>
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                        ĐĂNG NHẬP
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    Chưa có tài khoản? <a href="register.html" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a>
                </div>

                <div class="border-top mt-4 pt-3 text-center">
                    <a href="index.html" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer bg-dark text-white pt-3 pb-3 mt-auto">
        <div class="container-site text-center small text-secondary">
            © 2026 Nova Shop - Hệ thống laptop, PC &amp; linh kiện chính hãng.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
